<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK OS — Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/auth.js"></script>
  <style>
    :root {
      --ink:#1C1A16; --ink-soft:#2C2A24; --ink-muted:#5A5248;
      --cream:#F5F2EC; --sand:#EAE0CE; --border:#CEC3B0;
      --earth:#B09070; --earth-dim:#8A7055;
      --sea:#4A7A8A; --sea-dim:#3A6070; --sea-pale:rgba(74,122,138,0.09);
      --positive:#4A7A4A; --negative:#8A4A4A;
      --display:'Cinzel',Georgia,serif; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',-apple-system,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:16px;} body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;}

    /* NAV */
    .nav{position:sticky;top:0;z-index:100;background:rgba(245,242,236,0.96);backdrop-filter:blur(8px);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;gap:16px;}
    .nav-brand{font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:5px;color:var(--ink);text-decoration:none;white-space:nowrap;}
    .nav-brand span{font-family:var(--sans);font-size:8px;font-weight:300;letter-spacing:3px;color:var(--ink-muted);text-transform:uppercase;margin-left:8px;vertical-align:middle;}
    .nav-tabs{display:flex;border:0.5px solid var(--border);overflow:hidden;}
    .nav-tab{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-muted);text-decoration:none;padding:9px 16px;border-right:0.5px solid var(--border);transition:background 160ms ease,color 160ms ease;white-space:nowrap;}
    .nav-tab:last-child{border-right:none;} .nav-tab:hover{background:var(--sand);color:var(--ink);} .nav-tab.active{background:var(--ink);color:var(--cream);}
    .nav-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
    .btn-nav{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border:0.5px solid var(--border);background:transparent;color:var(--ink-muted);cursor:pointer;transition:all 160ms ease;white-space:nowrap;}
    .btn-nav:hover{border-color:var(--sea);color:var(--sea-dim);background:var(--sea-pale);}
    .btn-nav.primary{background:var(--ink);color:var(--cream);border-color:var(--ink);} .btn-nav.primary:hover{background:var(--ink-soft);}

    /* PAGE */
    .page{max-width:960px;margin:0 auto;padding:32px 24px 80px;}

    /* SECTION HEADER */
    .section-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;margin-top:40px;}
    .section-header:first-child{margin-top:0;}
    .section-title{font-family:var(--display);font-size:10px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--sea-dim);white-space:nowrap;}
    .section-line{flex:1;height:0.5px;background:var(--border);}

    /* SUMMARY STRIP */
    .summary-strip{display:flex;gap:0;border:0.5px solid var(--border);margin-bottom:20px;background:rgba(255,255,255,0.5);overflow:hidden;}
    .strip-item{flex:1;padding:14px 18px;border-right:0.5px solid var(--border);text-align:center;}
    .strip-item:last-child{border-right:none;}
    .strip-label{font-family:var(--sans);font-size:7px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;}
    .strip-val{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:1px;color:var(--ink);}
    .strip-val.alert{color:var(--negative);} .strip-val.good{color:var(--positive);}

    /* FILTERS */
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
    .filter-label{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;}
    .filter-select{font-family:var(--sans);font-size:11px;font-weight:300;color:var(--ink);padding:7px 11px;border:0.5px solid var(--border);background:rgba(255,255,255,0.6);outline:none;border-radius:0;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color 160ms ease;}
    .filter-select:focus{border-color:var(--sea);}
    .filter-chip{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;padding:7px 13px;border:0.5px solid var(--border);background:transparent;color:var(--ink-muted);cursor:pointer;transition:all 160ms ease;}
    .filter-chip:hover{border-color:var(--sea);color:var(--sea-dim);}
    .filter-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}

    /* TABLE */
    .table-wrap{border:0.5px solid var(--border);overflow:hidden;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;min-width:680px;}
    thead tr{background:rgba(245,242,236,0.8);border-bottom:0.5px solid var(--border);}
    th{font-family:var(--sans);font-size:7px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-muted);padding:10px 14px;text-align:left;white-space:nowrap;}
    tbody tr{border-bottom:0.5px solid var(--border);transition:background 120ms ease;}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:rgba(234,224,206,0.25);}
    td{padding:12px 14px;font-family:var(--sans);font-size:12px;font-weight:300;color:var(--ink);vertical-align:middle;}
    .td-title{font-weight:400;color:var(--ink);}
    .td-desc{font-size:11px;color:var(--ink-muted);margin-top:2px;}
    .td-unit{display:flex;align-items:center;gap:7px;}
    .unit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .td-actions{display:flex;gap:5px;justify-content:flex-end;}
    .td-date{font-family:var(--display);font-size:11px;letter-spacing:1px;color:var(--ink);white-space:nowrap;}

    /* CATEGORY BADGE */
    .cat-badge{display:inline-flex;align-items:center;font-family:var(--sans);font-size:7px;font-weight:400;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border:0.5px solid;white-space:nowrap;}
    .cat-badge.Maintenance{color:#4A6A8A;border-color:rgba(74,106,138,0.4);background:rgba(74,106,138,0.08);}
    .cat-badge.Complaint{color:var(--negative);border-color:rgba(138,74,74,0.4);background:rgba(138,74,74,0.08);}
    .cat-badge.Urgent{color:#8A4A2A;border-color:rgba(138,74,42,0.4);background:rgba(138,74,42,0.08);}
    .cat-badge.Supply{color:var(--earth-dim);border-color:rgba(176,144,112,0.4);background:rgba(176,144,112,0.08);}
    .cat-badge.Other{color:var(--ink-muted);border-color:var(--border);background:transparent;}

    /* STATUS PILL */
    .status-pill{display:inline-flex;align-items:center;font-family:var(--sans);font-size:7px;font-weight:400;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;cursor:pointer;border:0.5px solid var(--border);transition:all 160ms ease;white-space:nowrap;}
    .status-pill.Open{color:var(--earth-dim);border-color:rgba(176,144,112,0.4);background:rgba(176,144,112,0.08);}
    .status-pill.In\ Progress{color:var(--sea-dim);border-color:rgba(74,122,138,0.4);background:var(--sea-pale);}
    .status-pill.Done{color:var(--positive);border-color:rgba(74,122,74,0.4);background:rgba(74,122,74,0.08);}
    .status-pill:hover{opacity:0.75;}

    /* BTN */
    .btn{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border:0.5px solid var(--border);background:transparent;color:var(--ink-muted);cursor:pointer;transition:all 160ms ease;}
    .btn:hover{border-color:var(--sea);color:var(--sea-dim);background:var(--sea-pale);}
    .btn.primary{background:var(--ink);color:var(--cream);border-color:var(--ink);} .btn.primary:hover{background:var(--ink-soft);}
    .btn.danger{color:var(--negative);border-color:rgba(138,74,74,0.35);} .btn.danger:hover{background:rgba(138,74,74,0.07);border-color:var(--negative);}
    .btn-icon{width:26px;height:26px;border:0.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);transition:all 160ms ease;flex-shrink:0;}
    .btn-icon:hover{border-color:var(--sea);color:var(--sea-dim);}
    .btn-icon svg{width:10px;height:10px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;}

    /* EMPTY */
    .empty-state{padding:56px 24px;text-align:center;}
    .empty-state-title{font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:2px;color:var(--ink-muted);margin-bottom:8px;}
    .empty-state-sub{font-family:var(--sans);font-size:12px;font-weight:300;color:var(--ink-muted);}

    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(28,26,22,0.55);z-index:500;display:flex;align-items:flex-start;justify-content:center;opacity:0;pointer-events:none;transition:opacity 260ms ease;overflow-y:auto;padding:32px 20px;}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .modal{background:var(--cream);width:100%;max-width:560px;border:0.5px solid var(--border);transform:translateY(10px);transition:transform 280ms cubic-bezier(0.4,0,0.2,1);margin:auto;}
    .modal-overlay.open .modal{transform:translateY(0);}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 16px;border-bottom:0.5px solid var(--border);}
    .modal-title{font-family:var(--display);font-size:9px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--ink);}
    .modal-close{width:26px;height:26px;border:0.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);transition:all 160ms ease;}
    .modal-close:hover{border-color:var(--ink);color:var(--ink);}
    .modal-close svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;}
    .modal-body{padding:22px;}
    .modal-footer{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-top:0.5px solid var(--border);gap:10px;}
    .modal-footer-right{display:flex;gap:7px;margin-left:auto;}

    /* FORMS */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .form-group{display:flex;flex-direction:column;gap:5px;}
    .form-group.full{grid-column:1/-1;}
    .form-label{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);}
    .form-input,.form-select,.form-textarea{width:100%;padding:9px 11px;border:0.5px solid var(--border);background:rgba(255,255,255,0.6);font-family:var(--sans);font-size:13px;font-weight:300;color:var(--ink);outline:none;border-radius:0;appearance:none;-webkit-appearance:none;transition:border-color 180ms ease;}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--sea);}
    .form-textarea{resize:vertical;min-height:80px;}

    /* STATUS SELECTOR IN MODAL */
    .status-chips{display:flex;gap:5px;}
    .status-chip{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;padding:7px 13px;border:0.5px solid var(--border);background:transparent;color:var(--ink-muted);cursor:pointer;transition:all 160ms ease;}
    .status-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}

    ::-webkit-scrollbar{width:4px;height:4px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--border);}
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="./index.html">ARK <span>OS</span></a>
  <div class="nav-tabs">
    <a class="nav-tab" href="./index.html">Calendar</a>
    <a class="nav-tab" href="./cleaning.html">Cleaning</a>
    <a class="nav-tab active" href="./tasks.html">Tasks</a>
    <a class="nav-tab" href="./analytics.html">Analytics</a>
    <a class="nav-tab" href="./finance.html">Finance</a>
  </div>
  <div class="nav-actions">
    <button class="btn-nav primary" onclick="openAddModal()">+ Task</button>
  </div>
</nav>

<div class="page">

  <!-- SUMMARY STRIP -->
  <div class="summary-strip" id="summaryStrip"></div>

  <!-- FILTERS -->
  <div class="section-header">
    <div class="section-title">Tasks &amp; Complaints</div>
    <div class="section-line"></div>
  </div>

  <div class="filters">
    <span class="filter-label">Category</span>
    <select class="filter-select" id="filterCat" onchange="render()">
      <option value="">All Categories</option>
      <option>Maintenance</option>
      <option>Complaint</option>
      <option>Urgent</option>
      <option>Supply</option>
      <option>Other</option>
    </select>
    <span class="filter-label" style="margin-left:8px">Unit</span>
    <select class="filter-select" id="filterUnit" onchange="render()">
      <option value="">All Units</option>
    </select>
    <span class="filter-label" style="margin-left:8px">Status</span>
    <button class="filter-chip active" id="chip-all"         onclick="setStatusFilter('all')"        >All</button>
    <button class="filter-chip"        id="chip-Open"        onclick="setStatusFilter('Open')"       >Open</button>
    <button class="filter-chip"        id="chip-In Progress" onclick="setStatusFilter('In Progress')">In Progress</button>
    <button class="filter-chip"        id="chip-Done"        onclick="setStatusFilter('Done')"       >Done</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap" id="tableWrap"></div>

</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">New Task</div>
      <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">Title</label>
          <input class="form-input" type="text" id="f-title" placeholder="Brief description of the issue" />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="f-cat">
            <option>Maintenance</option>
            <option>Complaint</option>
            <option>Urgent</option>
            <option>Supply</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Unit</label>
          <select class="form-select" id="f-unit">
            <option value="">— General / No Unit —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Assigned To</label>
          <input class="form-input" type="text" id="f-assigned" placeholder="Name or role" />
        </div>
        <div class="form-group">
          <label class="form-label">Date Reported</label>
          <input class="form-input" type="date" id="f-date" />
        </div>
        <div class="form-group full">
          <label class="form-label">Status</label>
          <div class="status-chips">
            <button class="status-chip active" data-s="Open"        onclick="setModalStatus('Open')">Open</button>
            <button class="status-chip"        data-s="In Progress" onclick="setModalStatus('In Progress')">In Progress</button>
            <button class="status-chip"        data-s="Done"        onclick="setModalStatus('Done')">Done</button>
          </div>
        </div>
        <div class="form-group full">
          <label class="form-label">Notes</label>
          <textarea class="form-textarea" id="f-notes" placeholder="Additional details, follow-up actions…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="deleteBtn" onclick="deleteTask()" style="display:none">Delete</button>
      <div class="modal-footer-right">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveTask()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
/* DB comes from js/db.js */

/* ══════════ HELPERS ══════════ */
function uuid(){ return 'xxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16)); }
function toDateStr(d){ return d.toISOString().split('T')[0]; }
function fmtDateShort(s){ if(!s) return '—'; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function getUnitById(id){ return DB.getUnits().find(u=>u.id===id)||{id,name:id||'General',color:'#999'}; }
function getActiveUnits(){ return DB.getUnits().filter(u=>u.active); }

/* ══════════ STATE ══════════ */
let statusFilter = 'all';
let editingId = null;
let modalStatus = 'Open';

function setStatusFilter(f){
  statusFilter = f;
  ['all','Open','In Progress','Done'].forEach(s=>{
    document.getElementById('chip-'+s).classList.toggle('active', s===f);
  });
  render();
}

function setModalStatus(s){
  modalStatus = s;
  document.querySelectorAll('.status-chip').forEach(c=>c.classList.toggle('active',c.dataset.s===s));
}

/* ══════════ INIT ══════════ */
function initPage(){
  const unitSel = document.getElementById('filterUnit');
  getActiveUnits().forEach(u=>{
    const o=document.createElement('option'); o.value=u.id; o.textContent=u.name; unitSel.appendChild(o);
  });
  render();
}

/* ══════════ RENDER ══════════ */
function render(){ renderSummary(); renderTable(); }

function renderSummary(){
  const tasks = DB.getTasks();
  const open = tasks.filter(t=>t.status==='Open').length;
  const inProg = tasks.filter(t=>t.status==='In Progress').length;
  const done = tasks.filter(t=>t.status==='Done').length;
  const urgent = tasks.filter(t=>t.category==='Urgent'&&t.status!=='Done').length;
  document.getElementById('summaryStrip').innerHTML=`
    <div class="strip-item"><div class="strip-label">Open</div><div class="strip-val ${open>0?'alert':''}">${open}</div></div>
    <div class="strip-item"><div class="strip-label">In Progress</div><div class="strip-val ${inProg>0?'alert':''}">${inProg}</div></div>
    <div class="strip-item"><div class="strip-label">Done</div><div class="strip-val good">${done}</div></div>
    <div class="strip-item"><div class="strip-label">Urgent Open</div><div class="strip-val ${urgent>0?'alert':''}">${urgent}</div></div>`;
}

function renderTable(){
  const catF  = document.getElementById('filterCat').value;
  const unitF = document.getElementById('filterUnit').value;
  let tasks = DB.getTasks();
  if(catF)  tasks = tasks.filter(t=>t.category===catF);
  if(unitF) tasks = tasks.filter(t=>t.unitId===unitF);
  if(statusFilter!=='all') tasks = tasks.filter(t=>t.status===statusFilter);
  // Sort: urgent first, then by date desc
  const urgencyOrder = {Urgent:0,Complaint:1,Maintenance:2,Supply:3,Other:4};
  tasks.sort((a,b)=>{
    if(a.status==='Done'!==b.status==='Done') return a.status==='Done'?1:-1;
    const ua=urgencyOrder[a.category]??9, ub=urgencyOrder[b.category]??9;
    if(ua!==ub) return ua-ub;
    return (b.date||'')>(a.date||'')?1:-1;
  });

  const wrap = document.getElementById('tableWrap');
  if(!tasks.length){
    wrap.innerHTML=`<div class="empty-state"><div class="empty-state-title">No tasks found</div><div class="empty-state-sub">Log maintenance issues, complaints, and supply requests here.</div></div>`;
    return;
  }

  let rows = '';
  tasks.forEach(t=>{
    const u = t.unitId ? getUnitById(t.unitId) : null;
    const unitCell = u
      ? `<div class="td-unit"><div class="unit-dot" style="background:${u.color}"></div>${u.name}</div>`
      : `<span style="font-family:var(--sans);font-size:11px;color:var(--ink-muted)">General</span>`;
    const cat = t.category||'Other';
    const statusCycleMap = {Open:'In Progress','In Progress':'Done',Done:'Open'};
    rows += `<tr style="${t.category==='Urgent'&&t.status!=='Done'?'background:rgba(138,74,42,0.03)':''}">
      <td class="td-date">${fmtDateShort(t.date)}</td>
      <td><div><div class="td-title">${t.title||'—'}</div>${t.notes?`<div class="td-desc">${t.notes.slice(0,80)}${t.notes.length>80?'…':''}</div>`:''}</div></td>
      <td><span class="cat-badge ${cat}">${cat}</span></td>
      <td>${unitCell}</td>
      <td style="font-size:11px;color:var(--ink-muted)">${t.assignedTo||'—'}</td>
      <td><span class="status-pill ${t.status}" onclick="cycleStatus('${t.id}','${statusCycleMap[t.status||'Open']}')" title="Click to advance">${t.status||'Open'}</span></td>
      <td><div class="td-actions">
        <button class="btn-icon" title="Edit" onclick="openEditModal('${t.id}')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      </div></td>
    </tr>`;
  });

  wrap.innerHTML=`<table>
    <thead><tr>
      <th>Date</th><th>Title / Notes</th><th>Category</th><th>Unit</th><th>Assigned</th><th>Status</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ══════════ STATUS CYCLE ══════════ */
function cycleStatus(id, next){
  const tasks = DB.getTasks();
  const t = tasks.find(t=>t.id===id);
  if(!t) return;
  t.status = next;
  DB.saveTasks(tasks);
  render();
}

/* ══════════ MODAL ══════════ */
function populateUnitSelect(){
  const sel=document.getElementById('f-unit');
  // Keep first empty option
  while(sel.options.length>1) sel.remove(1);
  getActiveUnits().forEach(u=>{
    const o=document.createElement('option'); o.value=u.id; o.textContent=u.name; sel.appendChild(o);
  });
}

function openAddModal(){
  editingId=null; modalStatus='Open';
  document.getElementById('modalTitle').textContent='New Task';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('f-title').value='';
  document.getElementById('f-cat').value='Maintenance';
  populateUnitSelect();
  document.getElementById('f-unit').value='';
  document.getElementById('f-assigned').value='';
  document.getElementById('f-date').value=toDateStr(new Date());
  document.getElementById('f-notes').value='';
  setModalStatus('Open');
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal(id){
  editingId=id;
  const t=DB.getTasks().find(t=>t.id===id);
  if(!t) return;
  document.getElementById('modalTitle').textContent='Edit Task';
  document.getElementById('deleteBtn').style.display='block';
  document.getElementById('f-title').value=t.title||'';
  document.getElementById('f-cat').value=t.category||'Maintenance';
  populateUnitSelect();
  document.getElementById('f-unit').value=t.unitId||'';
  document.getElementById('f-assigned').value=t.assignedTo||'';
  document.getElementById('f-date').value=t.date||'';
  document.getElementById('f-notes').value=t.notes||'';
  setModalStatus(t.status||'Open');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); editingId=null; }

async function saveTask(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){ alert('Title is required.'); return; }
  const data={
    title, category:document.getElementById('f-cat').value,
    unitId:document.getElementById('f-unit').value||null,
    date:document.getElementById('f-date').value,
    notes:document.getElementById('f-notes').value.trim(),
    status:modalStatus,
  };
  const base = editingId ? (DB.getTasks().find(t=>t.id===editingId)||{}) : {id:uuid()};
  await DB.saveTask({...base, ...data});
  closeModal(); render();
}

async function deleteTask(){
  if(!editingId||!confirm('Delete this task?')) return;
  await DB.deleteTask(editingId);
  closeModal(); render();
}

/* ══════════ KEYBOARD ══════════ */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

DB.load().then(initPage);
</script>
</body>
</html>
