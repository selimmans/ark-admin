<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARK OS — Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/auth.js"></script>
  <style>
    :root {
      --ink:#1C1A16; --ink-soft:#2C2A24; --ink-muted:#5A5248;
      --cream:#F5F2EC; --sand:#EAE0CE; --border:#CEC3B0;
      --earth:#B09070; --earth-dim:#8A7055;
      --sea:#4A7A8A; --sea-dim:#3A6070; --sea-pale:rgba(74,122,138,0.09);
      --positive:#4A7A4A; --negative:#8A4A4A;
      --display:'Cinzel',Georgia,serif; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',-apple-system,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:16px;} body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;}

    /* NAV */
    .nav{position:sticky;top:0;z-index:100;background:rgba(245,242,236,0.96);backdrop-filter:blur(8px);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;gap:16px;}
    .nav-brand{font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:5px;color:var(--ink);text-decoration:none;white-space:nowrap;}
    .nav-brand span{font-family:var(--sans);font-size:8px;font-weight:300;letter-spacing:3px;color:var(--ink-muted);text-transform:uppercase;margin-left:8px;vertical-align:middle;}
    .nav-tabs{display:flex;border:0.5px solid var(--border);overflow:hidden;}
    .nav-tab{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-muted);text-decoration:none;padding:9px 16px;border-right:0.5px solid var(--border);transition:background 160ms ease,color 160ms ease;white-space:nowrap;}
    .nav-tab:last-child{border-right:none;} .nav-tab:hover{background:var(--sand);color:var(--ink);} .nav-tab.active{background:var(--ink);color:var(--cream);}
    .nav-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}

    /* PAGE */
    .page{max-width:1000px;margin:0 auto;padding:32px 24px 80px;}

    /* FILTERS */
    .page-filters{display:flex;gap:10px;align-items:center;margin-bottom:32px;padding-bottom:20px;border-bottom:0.5px solid var(--border);}
    .filter-label{font-family:var(--sans);font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);}
    .filter-select{font-family:var(--sans);font-size:11px;font-weight:300;color:var(--ink);padding:7px 11px;border:0.5px solid var(--border);background:rgba(255,255,255,0.6);outline:none;border-radius:0;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color 160ms ease;}
    .filter-select:focus{border-color:var(--sea);}

    /* SECTION HEADER */
    .section-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;margin-top:40px;}
    .section-header:first-child{margin-top:0;}
    .section-title{font-family:var(--display);font-size:10px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--sea-dim);white-space:nowrap;}
    .section-line{flex:1;height:0.5px;background:var(--border);}

    /* TOP METRICS ROW */
    .metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:32px;}
    @media(max-width:700px){.metrics-row{grid-template-columns:1fr 1fr;}}
    .metric-card{border:0.5px solid var(--border);background:rgba(255,255,255,0.5);padding:18px 20px 16px;}
    .metric-label{font-family:var(--sans);font-size:7px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;}
    .metric-value{font-family:var(--display);font-size:clamp(20px,3vw,28px);font-weight:400;letter-spacing:1px;color:var(--ink);}
    .metric-value.positive{color:var(--positive);}
    .metric-sub{font-family:var(--sans);font-size:10px;font-weight:300;color:var(--ink-muted);margin-top:5px;}

    /* OCCUPANCY TABLE */
    .occ-table{border:0.5px solid var(--border);overflow:hidden;overflow-x:auto;margin-bottom:8px;}
    table{width:100%;border-collapse:collapse;}
    thead tr{background:rgba(245,242,236,0.8);border-bottom:0.5px solid var(--border);}
    th{font-family:var(--sans);font-size:7px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-muted);padding:10px 14px;text-align:left;white-space:nowrap;}
    tbody tr{border-bottom:0.5px solid var(--border);}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:rgba(234,224,206,0.2);}
    td{padding:12px 14px;font-family:var(--sans);font-size:12px;font-weight:300;color:var(--ink);vertical-align:middle;}

    /* BAR */
    .bar-wrap{display:flex;align-items:center;gap:10px;width:100%;}
    .bar-track{flex:1;height:6px;background:rgba(206,195,176,0.35);border-radius:1px;overflow:hidden;min-width:80px;}
    .bar-fill{height:100%;border-radius:1px;transition:width 400ms ease;}
    .bar-pct{font-family:var(--display);font-size:11px;letter-spacing:1px;color:var(--ink);flex-shrink:0;min-width:36px;text-align:right;}

    /* UNIT COLOR DOT */
    .unit-cell{display:flex;align-items:center;gap:8px;}
    .unit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

    /* REVENUE GRID */
    .rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:640px){.rev-grid{grid-template-columns:1fr;}}

    /* REVENUE TABLE - unit breakdown */
    .rev-table{border:0.5px solid var(--border);overflow:hidden;}

    /* EXTRAS LIST */
    .extras-ranked{display:flex;flex-direction:column;gap:0;border:0.5px solid var(--border);overflow:hidden;}
    .extra-rank-row{display:grid;grid-template-columns:28px 1fr 80px 80px;align-items:center;padding:11px 14px;border-bottom:0.5px solid var(--border);transition:background 120ms ease;}
    .extra-rank-row:last-child{border-bottom:none;}
    .extra-rank-row:hover{background:rgba(234,224,206,0.2);}
    .rank-num{font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:1px;color:var(--ink-muted);}
    .rank-name{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink);}
    .rank-count{font-family:var(--sans);font-size:11px;font-weight:300;color:var(--ink-muted);text-align:right;}
    .rank-revenue{font-family:var(--display);font-size:12px;letter-spacing:0.5px;color:var(--ink);text-align:right;}

    /* NET SUMMARY */
    .net-box{border:0.5px solid var(--border);background:rgba(255,255,255,0.5);padding:22px 24px;}
    .net-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-family:var(--sans);font-size:13px;font-weight:300;color:var(--ink-muted);border-bottom:0.5px solid rgba(206,195,176,0.4);}
    .net-row:last-child{border-bottom:none;}
    .net-row.total{font-weight:400;font-size:15px;padding-top:12px;}
    .net-row.total .net-val{font-family:var(--display);font-size:18px;letter-spacing:1px;}
    .net-val{font-family:var(--display);font-size:14px;letter-spacing:1px;color:var(--ink);}
    .net-val.positive{color:var(--positive);} .net-val.negative{color:var(--negative);}

    /* EMPTY */
    .empty-note{font-family:var(--sans);font-size:12px;font-weight:300;color:var(--ink-muted);padding:32px 0;text-align:center;}

    ::-webkit-scrollbar{width:4px;height:4px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--border);}
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="./index.html">ARK <span>OS</span></a>
  <div class="nav-tabs">
    <a class="nav-tab" href="./index.html">Calendar</a>
    <a class="nav-tab" href="./cleaning.html">Cleaning</a>
    <a class="nav-tab" href="./tasks.html">Tasks</a>
    <a class="nav-tab active" href="./analytics.html">Analytics</a>
    <a class="nav-tab" href="./finance.html">Finance</a>
  </div>
  <div class="nav-actions"></div>
</nav>

<div class="page">

  <!-- MONTH FILTER -->
  <div class="page-filters">
    <span class="filter-label">Month</span>
    <select class="filter-select" id="filterMonth" onchange="render()"></select>
    <span class="filter-label" style="margin-left:8px">Year</span>
    <select class="filter-select" id="filterYear" onchange="populateMonths();render()"></select>
  </div>

  <!-- TOP METRICS -->
  <div class="metrics-row" id="metricsRow"></div>

  <!-- SECTION: OCCUPANCY -->
  <div class="section-header">
    <div class="section-title">Occupancy by Unit</div>
    <div class="section-line"></div>
  </div>
  <div class="occ-table" id="occTable"></div>

  <!-- SECTION: REVENUE PER UNIT -->
  <div class="section-header">
    <div class="section-title">Revenue by Unit</div>
    <div class="section-line"></div>
  </div>
  <div class="occ-table" id="revTable"></div>

  <!-- SECTION: EXTRAS -->
  <div class="section-header" style="margin-top:40px">
    <div class="section-title">Most Requested Extras</div>
    <div class="section-line"></div>
  </div>
  <div class="extras-ranked" id="extrasList"></div>

  <!-- SECTION: NET SUMMARY -->
  <div class="section-header" style="margin-top:40px">
    <div class="section-title">Net Summary</div>
    <div class="section-line"></div>
  </div>
  <div class="net-box" id="netBox"></div>

</div>

<script>
/* ══════════ DB ══════════ */
/* DB comes from js/db.js */;

/* ══════════ HELPERS ══════════ */
function fmtCurrency(n){ return 'EGP '+Math.round(n||0).toLocaleString(); }
function toDateStr(d){ return d.toISOString().split('T')[0]; }
function getUnitById(id){ return DB.getUnits().find(u=>u.id===id)||{id,name:id,color:'#999'}; }
function getAllUnits(){ return DB.getUnits(); }

// Days overlap with a given month (YYYY-MM string)
function daysInMonth(yearStr, monthStr){
  const y=parseInt(yearStr), m=parseInt(monthStr)-1;
  return new Date(y, m+1, 0).getDate();
}

// Clamp booking nights to within month
function nightsInMonth(checkIn, checkOut, monthStr){
  if(!checkIn||!checkOut) return 0;
  const ci=new Date(checkIn), co=new Date(checkOut);
  const [y,m]=monthStr.split('-');
  const mStart=new Date(parseInt(y),parseInt(m)-1,1);
  const mEnd=new Date(parseInt(y),parseInt(m),1); // exclusive
  const start=ci<mStart?mStart:ci;
  const end=co>mEnd?mEnd:co;
  if(end<=start) return 0;
  return (end-start)/(1000*60*60*24);
}

/* ══════════ MONTH/YEAR FILTERS ══════════ */
function populateYears(){
  const sel=document.getElementById('filterYear');
  const now=new Date();
  const currentYear=now.getFullYear();
  sel.innerHTML='';
  for(let y=currentYear+1;y>=currentYear-2;y--){
    const o=document.createElement('option'); o.value=y; o.textContent=y;
    if(y===currentYear) o.selected=true;
    sel.appendChild(o);
  }
}

function populateMonths(){
  const sel=document.getElementById('filterMonth');
  const cur=sel.value;
  sel.innerHTML='';
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  months.forEach((name,i)=>{
    const o=document.createElement('option');
    o.value=String(i+1).padStart(2,'0');
    o.textContent=name;
    sel.appendChild(o);
  });
  if(cur) sel.value=cur;
  else sel.value=String(new Date().getMonth()+1).padStart(2,'0');
}

function getMonthStr(){
  const y=document.getElementById('filterYear').value;
  const m=document.getElementById('filterMonth').value;
  return `${y}-${m}`;
}

/* ══════════ RENDER ══════════ */
function render(){
  const monthStr=getMonthStr();
  const bookings=DB.getBookings().filter(b=>b.status!=='cancelled');
  const monthBookings=bookings.filter(b=>{
    if(!b.checkIn||!b.checkOut) return false;
    const ci=new Date(b.checkIn), co=new Date(b.checkOut);
    const [y,m]=monthStr.split('-');
    const mStart=new Date(parseInt(y),parseInt(m)-1,1);
    const mEnd=new Date(parseInt(y),parseInt(m),1);
    return ci<mEnd && co>mStart;
  });

  renderMetrics(monthStr, monthBookings, bookings);
  renderOccupancy(monthStr, monthBookings);
  renderRevenue(monthStr, monthBookings);
  renderExtras(monthStr, monthBookings);
  renderNet(monthStr, monthBookings);
}

/* ══════════ METRICS ══════════ */
function renderMetrics(monthStr, monthBookings, allBookings){
  // Total revenue this month
  const revenue = monthBookings.reduce((s,b)=>s+(b.finalAmount||0),0);

  // Avg booking length (nights) — all confirmed bookings in month
  const lengthBookings = monthBookings.filter(b=>b.checkIn&&b.checkOut);
  const avgNights = lengthBookings.length
    ? lengthBookings.reduce((s,b)=>{
        const nights=(new Date(b.checkOut)-new Date(b.checkIn))/(1000*60*60*24);
        return s+nights;
      },0)/lengthBookings.length
    : 0;

  // Revenue per night (revenue / total booked nights this month)
  const totalNights = monthBookings.reduce((s,b)=>s+nightsInMonth(b.checkIn,b.checkOut,monthStr),0);
  const revPerNight = totalNights>0 ? revenue/totalNights : 0;

  // Total bookings this month
  const totalBookings = new Set(monthBookings.map(b=>b.id)).size;

  document.getElementById('metricsRow').innerHTML=`
    <div class="metric-card">
      <div class="metric-label">Revenue This Month</div>
      <div class="metric-value positive">${fmtCurrency(revenue)}</div>
      <div class="metric-sub">${totalBookings} booking${totalBookings!==1?'s':''}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Avg Booking Length</div>
      <div class="metric-value">${avgNights.toFixed(1)}</div>
      <div class="metric-sub">nights average</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Revenue per Night</div>
      <div class="metric-value">${fmtCurrency(revPerNight)}</div>
      <div class="metric-sub">${Math.round(totalNights)} booked nights</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Total Nights Booked</div>
      <div class="metric-value">${Math.round(totalNights)}</div>
      <div class="metric-sub">across all units</div>
    </div>`;
}

/* ══════════ OCCUPANCY ══════════ */
function renderOccupancy(monthStr, monthBookings){
  const units=getAllUnits().filter(u=>u.active);
  if(!units.length){ document.getElementById('occTable').innerHTML='<div class="empty-note">No active units.</div>'; return; }
  const [y,m]=monthStr.split('-');
  const daysTotal=daysInMonth(y,m);

  let rows='';
  units.forEach(u=>{
    const unitBookings=monthBookings.filter(b=>(b.accommodations||[]).includes(u.id));
    const bookedNights=unitBookings.reduce((s,b)=>s+nightsInMonth(b.checkIn,b.checkOut,monthStr),0);
    const pct=Math.min(100,Math.round((bookedNights/daysTotal)*100));
    const rev=unitBookings.reduce((s,b)=>s+(b.finalAmount||0)/Math.max(1,(b.accommodations||[]).length),0);
    rows+=`<tr>
      <td><div class="unit-cell"><div class="unit-dot" style="background:${u.color}"></div>${u.name}</div></td>
      <td><div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${u.color}"></div></div>
        <div class="bar-pct">${pct}%</div>
      </div></td>
      <td style="text-align:right;font-family:var(--display);font-size:12px;letter-spacing:0.5px">${Math.round(bookedNights)} / ${daysTotal}</td>
      <td style="text-align:right;font-family:var(--display);font-size:12px;letter-spacing:0.5px;color:var(--ink-muted)">${fmtCurrency(rev)}</td>
    </tr>`;
  });
  document.getElementById('occTable').innerHTML=`<table>
    <thead><tr><th>Unit</th><th>Occupancy</th><th style="text-align:right">Nights Booked</th><th style="text-align:right">Est. Revenue</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ══════════ REVENUE BY UNIT ══════════ */
function renderRevenue(monthStr, monthBookings){
  const units=getAllUnits().filter(u=>u.active);
  if(!units.length){ document.getElementById('revTable').innerHTML='<div class="empty-note">No active units.</div>'; return; }

  // Build unit revenue map — split shared bookings evenly
  const unitRev={};
  units.forEach(u=>unitRev[u.id]=0);
  monthBookings.forEach(b=>{
    const share=(b.finalAmount||0)/Math.max(1,(b.accommodations||[]).length);
    (b.accommodations||[]).forEach(uid=>{ if(unitRev[uid]!==undefined) unitRev[uid]+=share; });
  });
  const maxRev=Math.max(...Object.values(unitRev),1);

  let rows='';
  [...units].sort((a,b)=>unitRev[b.id]-unitRev[a.id]).forEach(u=>{
    const rev=unitRev[u.id]||0;
    const pct=Math.round((rev/maxRev)*100);
    rows+=`<tr>
      <td><div class="unit-cell"><div class="unit-dot" style="background:${u.color}"></div>${u.name}</div></td>
      <td><div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${u.color}"></div></div>
      </div></td>
      <td style="text-align:right;font-family:var(--display);font-size:13px;letter-spacing:0.5px">${fmtCurrency(rev)}</td>
    </tr>`;
  });
  document.getElementById('revTable').innerHTML=`<table>
    <thead><tr><th>Unit</th><th>Relative Revenue</th><th style="text-align:right">Est. Revenue</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ══════════ EXTRAS ══════════ */
function renderExtras(monthStr, monthBookings){
  const extraMap={};
  monthBookings.forEach(b=>{
    (b.extras||[]).forEach(e=>{
      if(!e.name) return;
      if(!extraMap[e.name]) extraMap[e.name]={count:0,revenue:0};
      extraMap[e.name].count++;
      extraMap[e.name].revenue+=(e.price||0);
    });
  });
  const sorted=Object.entries(extraMap).sort((a,b)=>b[1].count-a[1].count);
  const el=document.getElementById('extrasList');
  if(!sorted.length){ el.innerHTML='<div class="empty-note">No extras recorded this month.</div>'; return; }
  el.innerHTML=sorted.slice(0,10).map(([name,d],i)=>`
    <div class="extra-rank-row">
      <div class="rank-num">${i+1}</div>
      <div class="rank-name">${name}</div>
      <div class="rank-count">${d.count}×</div>
      <div class="rank-revenue">${fmtCurrency(d.revenue)}</div>
    </div>`).join('');
}

/* ══════════ NET SUMMARY ══════════ */
function renderNet(monthStr, monthBookings){
  const revenue=monthBookings.reduce((s,b)=>s+(b.finalAmount||0),0);
  const costs=DB.getCosts().filter(c=>c.date&&c.date.startsWith(monthStr));
  const totalCosts=costs.reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
  const net=revenue-totalCosts;

  document.getElementById('netBox').innerHTML=`
    <div class="net-row"><span>Revenue This Month</span><span class="net-val">${fmtCurrency(revenue)}</span></div>
    <div class="net-row"><span>Costs This Month</span><span class="net-val">${fmtCurrency(totalCosts)}</span></div>
    <div class="net-row total"><span>Net</span><span class="net-val ${net>=0?'positive':'negative'}">${fmtCurrency(net)}</span></div>`;
}

/* ══════════ INIT ══════════ */
DB.load().then(() => { populateYears(); populateMonths(); render(); });

window.onRoleReady = function(role) {
  if (role === 'staff') window.location.replace('./index.html')
}
</script>
</body>
</html>
